name: Java CI with Gradle & SonarCloud

on:
  push:
    branches: [ main, testing ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      API_KEY_ASSEMBLY: ${{ secrets.API_KEY_ASSEMBLY }}
      API_KEY_DEEPSEEK: ${{ secrets.API_KEY_DEEPSEEK }}
      CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_URL: ${{ secrets.DB_URL }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      JWT_EXPIRATION: ${{ secrets.JWT_EXPIRATION }}
      JWT_TOKEN: ${{ secrets.JWT_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      APP_URL: 'http://localhost:8080'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # --- Nuevos pasos para ZAP ---
      - name: Build application
        run: ./gradlew build -x test

      - name: Run Spring Boot application in background
        run: |
          ./gradlew bootRun &
          echo "Waiting for application to start..."
          timeout 60s bash -c 'until curl -s ${{ env.APP_URL }} > /dev/null; do echo "Still waiting..."; sleep 5; done'
          echo "Application started!"

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.11.0
        with:
          target: ${{ env.APP_URL }}
          cmd_options: '-r zap-report.html -D 10020 -D 10021'

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-security-report
          path: zap-report.html

      - name: Build, test & coverage
        run: ./gradlew test jacocoTestReport

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          projectBaseDir: .
          args: >
            -Dsonar.projectKey=4meM_EmilyTalks
            -Dsonar.organization=4mem
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.java.binaries=.
            -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
            -Dsonar.sources=src/main/java
            -Dsonar.tests=src/test/java
            -Dsonar.exclusions=src/test/java/**
